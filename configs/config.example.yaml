# GoOnCall Agent 配置模板。复制为 config.local.yaml 后按运行环境填写。
server:
  host: 0.0.0.0
  # 可用环境变量 SERVER_PORT 覆盖（本机与 GoCommunity 等占用 8080 时设为 8082）。
  port: 8080

# 诊断大模型，与 Embedding 服务相互独立。
llm:
  provider: openai
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}

# OpenAI 兼容的 Embedding 服务。当前 Qdrant collection 维度为 768。
embedding:
  provider: openai
  base_url: ${EMBEDDING_BASE_URL}
  api_key: ${EMBEDDING_API_KEY}
  model: ${EMBEDDING_MODEL}

postgres:
  dsn: ${POSTGRES_DSN}

redis:
  addr: ${REDIS_ADDR}
  password: ${REDIS_PASSWORD}
  db: 0

rabbitmq:
  url: ${RABBITMQ_URL}
  management_url: ${RABBITMQ_MANAGEMENT_URL}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}

prometheus:
  url: ${PROMETHEUS_URL}

qdrant:
  # gRPC 地址，如 http://localhost:6334；省略端口时默认 6334。
  url: ${QDRANT_URL}
  collection: gooncall_knowledge
  dim: 768

vector_store:
  provider: qdrant

# RAG 混合检索。candidate_k 为向量检索候选集大小，远小于知识库 chunk 总量，
# 避免每次查询按全量 chunks 做向量 topK（chunk 数量大时显著影响性能）。
rag:
  top_k: 8
  candidate_k: 20
  # 可选的 cross-encoder 重排；启用后调用失败会直接返回错误，不降级到 RRF。
  reranker:
    enabled: ${RERANK_ENABLED}
    provider: ${RERANK_PROVIDER}
    base_url: ${RERANK_BASE_URL}
    api_key: ${RERANK_API_KEY}
    model: ${RERANK_MODEL}

# Agent 运行时约束。timeout_seconds 为整轮诊断超时（覆盖全部步骤与工具调用），
# 单次工具调用超时由 tool.timeout_seconds 控制。
agent:
  max_steps: 15
  max_tool_calls: 20
  timeout_seconds: 180

tool:
  timeout_seconds: 30

approval:
  enabled: true

# 三类最小认证。Token 为空表示该类未启用，只允许出现在 Demo 配置里
# （execution.mode=mock）。execution.mode=http 时三者必须全部非空，否则启动失败。
auth:
  webhook_token: ${ALERT_WEBHOOK_TOKEN}
  read_token: ${API_READ_TOKEN}
  admin_token: ${API_ADMIN_TOKEN}
  # 批准 / 拒绝落库的 approved_by：服务端配置，请求体里的 approved_by 一律忽略。
  admin_actor: ${API_ADMIN_ACTOR}
