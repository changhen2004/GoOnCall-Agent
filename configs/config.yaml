# GoOnCall Agent 配置示例。使用 ${VAR} 引用环境变量（未设置时展开为空）。
server:
  host: 0.0.0.0
  # 可用环境变量 SERVER_PORT 覆盖（本机与 GoCommunity 等占用 8080 时设为 8082）。
  port: 8080

llm:
  provider: openai
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  embedding_model: ${LLM_EMBEDDING_MODEL}

postgres:
  dsn: ${POSTGRES_DSN}

redis:
  addr: ${REDIS_ADDR}
  password: ${REDIS_PASSWORD}
  db: 0

rabbitmq:
  url: ${RABBITMQ_URL}
  management_url: ${RABBITMQ_MANAGEMENT_URL}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}

prometheus:
  url: ${PROMETHEUS_URL}

qdrant:
  url: ${QDRANT_URL}
  collection: gooncall_knowledge
  dim: 1536

vector_store:
  provider: memory

# RAG 混合检索。candidate_k 为向量检索候选集大小，远小于知识库 chunk 总量，
# 避免每次查询按全量 chunks 做向量 topK（chunk 数量大时显著影响性能）。
rag:
  top_k: 8
  candidate_k: 20

# Agent 运行时约束。timeout_seconds 为整轮诊断超时（覆盖全部步骤与工具调用），
# 单次工具调用超时由 tool.timeout_seconds 控制。
agent:
  max_steps: 15
  max_tool_calls: 20
  timeout_seconds: 180

tool:
  timeout_seconds: 30

approval:
  enabled: true

verification:
  # mock：固定「已恢复」指标（本地 Demo）；prometheus：实时查询验证指标。
  # 可用环境变量 VERIFICATION_MODE 覆盖（如 VERIFICATION_MODE=prometheus）。
  mode: ${VERIFICATION_MODE}
  # Prometheus 验证查询（mode=prometheus 时生效）。对接 GoCommunity 业务系统时
  # 覆盖为 resource_community_http_* 指标名，例如：
  #   error_rate: 'sum(rate(resource_community_http_requests_total{status=~"5.."}[1m])) / clamp_min(sum(rate(resource_community_http_requests_total[1m])), 0.001)'
  queries:
    consumers: 'sum(rabbitmq_queue_consumers)'
    queue_depth: 'sum(rabbitmq_queue_messages_ready)'
    error_rate: 'sum(rate(http_requests_total{status=~"5.."}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 0.001)'
