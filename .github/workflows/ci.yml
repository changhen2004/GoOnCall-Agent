name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 依赖整理检查
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: 代码格式检查
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "以下文件需要 gofmt 格式化："
            gofmt -l .
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 单元测试
        run: go test ./... -count=1
