services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gooncall
      RABBITMQ_DEFAULT_PASS: gooncall
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  gooncall-agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      # 真实配置挂载自宿主机；密钥不写入镜像。
      AGENT_CONFIG: /app/configs/config.env
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 只读业务工具显式启用。
      AGENT_PROMETHEUS_ENABLED: "true"
      PROMETHEUS_URL: http://prometheus:9090
      AGENT_RABBITMQ_ENABLED: "true"
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USERNAME: gooncall
      RABBITMQ_PASSWORD: gooncall
      # RAG 默认关闭；启用时使用本地 Qdrant 与独立 Embedding 服务。
      AGENT_RAG_ENABLED: ${AGENT_RAG_ENABLED:-false}
      QDRANT_URL: http://qdrant:6334
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      AGENT_SESSION_TTL: ${AGENT_SESSION_TTL:-24h}
    volumes:
      - ./configs:/app/configs:ro
      - ./docs:/app/docs:ro
      - agent_data:/app/data
    ports:
      - "127.0.0.1:${AGENT_PORT:-8091}:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  qdrant_data:
  agent_data:
