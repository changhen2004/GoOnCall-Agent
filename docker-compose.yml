services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gooncall
      POSTGRES_PASSWORD: gooncall
      POSTGRES_DB: gooncall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gooncall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gooncall
      RABBITMQ_DEFAULT_PASS: gooncall
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    # 固定版本，避免 latest 未来 breaking change（当前：2026-08）
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  gooncall-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: api
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_DSN: postgres://gooncall:gooncall@postgres:5432/gooncall?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://gooncall:gooncall@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USERNAME: gooncall
      RABBITMQ_PASSWORD: gooncall
      PROMETHEUS_URL: http://prometheus:9090
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  gooncall-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: worker
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_DSN: postgres://gooncall:gooncall@postgres:5432/gooncall?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://gooncall:gooncall@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  grafana_data:
